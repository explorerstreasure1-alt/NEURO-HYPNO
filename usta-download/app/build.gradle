plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Web uygulaması tek dosyaya derleniyor (vite-plugin-singlefile).
def webDist = file("$rootDir/../spatial-audio-processing-script (1)/dist/index.html")

android {
    namespace 'com.usta.download'
    compileSdk 34

    defaultConfig {
        applicationId "com.usta.download"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"

        // Boş = APK içindeki gömülü web uygulaması kullanılır (internet gerekmez).
        // Uzak sürüm için: ./gradlew assembleDebug -PappUrl=https://senin-app.vercel.app
        def remoteUrl = (project.findProperty("appUrl") ?: "").toString()
        buildConfigField "String", "APP_URL", "\"${remoteUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

/**
 * Web derlemesini APK'nın içine gömer.
 * Önce `npm run build` çalıştırılmalı (dist/index.html üretir).
 */
tasks.register("syncWebAssets") {
    doLast {
        def assetsDir = file("$projectDir/src/main/assets")
        assetsDir.mkdirs()
        if (webDist.exists()) {
            copy {
                from webDist
                into assetsDir
                rename { "index.html" }
            }
            logger.lifecycle("Gömülü web uygulaması kopyalandı: ${webDist}")
        } else {
            logger.warn("dist/index.html bulunamadı — önce web uygulamasını derleyin (npm run build).")
        }
    }
}

preBuild.dependsOn("syncWebAssets")

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
